[workspace]
resolver = "2"
members = [
    "core",
    "cli",
    "xtask",
    "examples/rindexer_rust_playground",
    "e2e-tests",
    "examples/rust_clickhouse",
    "examples/clickhouse_factory_indexing",
    "examples/rindexer_factory_indexing"
]

[workspace.dependencies]
alloy = { version = "2", features = ["full"] }
alloy-chains = "0.2"
anyhow = "1"
clap = { version = "4.6.7", features = ["derive"] }
csv = "1.4.0"
hex = "0.4.3"
regex = "1.13"
reqwest = { version = "0.13.5", features = ["form", "json", "query"] }
rustls = { version = "0.23", features = ["ring"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
# serde_norway is a drop-in fork of the deprecated serde_yaml, renamed so call sites match upstream.
serde_yaml = { package = "serde_norway", version = "0.9.42" }
tempfile = "3.27"
thiserror = "2"
tokio = { version = "1", features = ["full"] }
tokio-postgres = "0.7"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt"] }
