name: Build & publish docker image

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Release version (e.g., 1.2.3) - leave empty for edge build'
        required: false
        type: string
  workflow_call:
    inputs:
      version:
        description: 'Release version (e.g., 1.2.3) - leave empty for edge build'
        required: false
        type: string
  release:
    types: [ published ]

env:
  REGISTRY: ghcr.io
  IMAGE: ghcr.io/${{ github.repository }}

jobs:
  build:
    name: Build & publish Docker image
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      # Login against a Docker registry
      # https://github.com/docker/login-action
      - name: Log into registry ${{ env.REGISTRY }}
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Resolve the release version from (in priority order): an explicit workflow
      # input, or the published release's tag. Empty => an unversioned "edge" build.
      - name: Determine version
        id: version
        run: |
          if [ -n "${{ inputs.version }}" ]; then
            VERSION="${{ inputs.version }}"
          elif [ "${{ github.event_name }}" = "release" ]; then
            VERSION="${{ github.event.release.tag_name }}"
          else
            VERSION=""
          fi
          # Normalise a leading "v" (v0.41.1 -> 0.41.1) so image tags are clean.
          VERSION="${VERSION#v}"
          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"

      # Build the tag list. A versioned build (release or explicit input) gets the
      # version tag AND :latest; everything else gets :edge. Every build is also
      # pinned to its commit via :sha-<short>.
      - name: Compute image tags
        id: tags
        run: |
          SHORT_SHA=$(echo "${{ github.sha }}" | cut -c1-7)
          VERSION="${{ steps.version.outputs.version }}"
          TAGS="${{ env.IMAGE }}:sha-${SHORT_SHA}"
          if [ -n "$VERSION" ]; then
            TAGS="${TAGS},${{ env.IMAGE }}:${VERSION},${{ env.IMAGE }}:latest"
          else
            TAGS="${TAGS},${{ env.IMAGE }}:edge"
          fi
          echo "tags=${TAGS}" >> "$GITHUB_OUTPUT"
          echo "Resolved tags: ${TAGS}"

      # Build and push Docker image with Buildx
      # https://github.com/docker/build-push-action
      - name: Build and push Docker image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          push: true
          tags: ${{ steps.tags.outputs.tags }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
